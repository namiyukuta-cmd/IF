<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DD TRPG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#17130f;color:#2f2418;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#gameScreen{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;display:grid;grid-template-rows:92px minmax(0,1fr) 54px;background:#e9d8b8}
#topBar{display:grid;grid-template-columns:54px minmax(0,1fr) 110px;background:#33271e;color:#f1dfc1;border-bottom:1px solid #6d563c;z-index:20}
#topLeft{display:flex;justify-content:center;padding-top:7px}
#topCenter{min-width:0;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:3px 4px}
#metaLine{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;font-size:12px;font-weight:700;white-space:nowrap}
#currentLocation{min-width:0;max-width:48%;overflow:hidden;text-overflow:ellipsis;font-weight:800}
#statusLine{margin-top:3px;display:flex;justify-content:center;gap:10px;font-size:12px}
#handLine{margin-top:3px;display:flex;justify-content:center;gap:10px;min-width:0;font-size:10px;line-height:1.25;color:#dfcbaa}
.hand-entry{min-width:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topRight{display:grid;grid-template-columns:46px 46px;grid-template-rows:38px 38px;gap:4px 5px;padding:6px 5px;justify-content:end}
#loadButton{grid-column:1;grid-row:1}#saveButton{grid-column:2;grid-row:1}#logButton{grid-column:2;grid-row:2}
.system-button{width:46px;height:38px;border:1px solid #776047;border-radius:7px;background:#49382a;color:#f2dfbe;padding:2px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800}
.system-button .icon{font-size:16px;line-height:1}.system-button .label{font-size:7px;margin-top:2px}
#mainArea{min-height:0;display:grid;grid-template-columns:88px minmax(0,1fr);overflow:hidden}
#equipmentArea{min-height:0;overflow-y:auto;background:#cab591;border-right:1px solid #9e8765;padding:8px 5px}
#equipmentTitle{margin:0 0 6px;text-align:center;font-size:12px;color:#4f3b29}
#equipmentList{display:grid;gap:3px}
.equipment-slot{padding:5px 2px;border-bottom:1px solid rgba(96,71,45,.28)}
.equipment-slot:last-child{border-bottom:0}
.equipment-slot-label{display:block;margin-bottom:2px;color:#5c4631;font-size:10px;line-height:1.25;font-weight:800}
.equipment-slot-item{display:block;color:#342719;font-size:11px;line-height:1.3;font-weight:750;overflow-wrap:anywhere}
.equipment-slot-item.empty{color:#806e58;font-weight:600}
#storyArea{min-width:0;min-height:0;overflow-y:auto;background:#f1e3c9;padding:17px 16px 26px}
#speakerName{margin-bottom:9px;font-size:20px;font-weight:850;color:#5e4630}
#messageText{margin:0;font-size:17px;line-height:1.9;white-space:pre-wrap}
#quickBar{z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:#30241b;border-top:1px solid #71593f}
.quick-button{min-width:0;min-height:42px;border:1px solid #806849;border-radius:6px;background:#ead4ae;color:#352719;padding:4px 1px;font-size:12px;line-height:1.1;font-weight:850;white-space:nowrap}
#windowLayer{position:absolute;z-index:100;inset:92px 7px calc(60px + env(safe-area-inset-bottom)) 7px;pointer-events:none}
#gameWindow{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;border:2px solid #6e563d;border-radius:9px;background:#f0e1c5;box-shadow:0 8px 25px rgba(0,0,0,.38);pointer-events:auto}
#windowHeader{min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 10px;background:#d6bd94;border-bottom:1px solid #866e4f}
#windowTitle{font-size:16px;font-weight:850}#windowCloseButton{width:36px;height:36px;border:1px solid #7c6245;border-radius:50%;background:#f2dec0;color:#3a2a1d;font-size:20px;font-weight:750}
#windowContent{flex:1;min-height:0;overflow:auto;padding:7px 8px 11px;font-size:13px;line-height:1.45}
.inventory-screen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 5px;align-items:start}
.inventory-money{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0}.inventory-money span{min-height:30px;display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid #a98d67;background:#dfc8a5;font-size:11px}
.inventory-weight{grid-column:1/-1;text-align:right;font-size:11px;line-height:1.2;margin:0 1px 2px}.inventory-title{grid-column:1/-1;margin:5px 0 0;font-size:14px;line-height:1.2}.inventory-row{width:100%;min-width:0;min-height:42px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;margin:0;padding:5px 6px;border:1px solid #a98d67;border-radius:6px;background:#f8ead0;color:#342719;text-align:left}.inventory-name{min-width:0;display:flex;flex-direction:column;line-height:1.15}.inventory-name strong{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inventory-name small{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inventory-quantity{font-size:11px}.inventory-name small,.inventory-row-meta{color:#715a40}.inventory-row-meta{font-size:9px}.inventory-row-side{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}.inventory-row.equipped{background:#dfc8a5}.inventory-empty{grid-column:1/-1;margin:2px 0;font-size:12px}.item-back,.item-actions button{min-height:38px;border:1px solid #806849;border-radius:6px;background:#ead4ae;color:#352719;font-size:13px;font-weight:800;padding:6px 9px}.item-detail,.item-ja,.item-owned-count,.item-text-section p,.item-stat{font-size:13px}.item-detail h2{font-size:17px;margin:8px 0 2px}.item-ja,.item-owned-count{margin:2px 0}.item-text-section{margin:8px 0;padding:8px;border:1px solid #b89c74;background:#f8ead0}.item-text-section h3,.item-list-section h3{font-size:14px;margin:0 0 4px}.item-stat{min-height:34px;display:flex;justify-content:space-between;border-bottom:1px solid #c4aa84;align-items:center}.item-actions{display:grid;gap:6px;margin-top:10px}
.skill-summary,.spell-intro{margin:0 0 5px;padding:5px 7px;border:1px solid #a48a64;border-radius:5px;background:#e1c9a2;font-size:11px;font-weight:750}.skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.skill-row{min-width:0;padding:4px 5px;border:1px solid #ad936d;border-radius:5px;background:#f8ead0}.skill-row.proficient{background:#ead7b7;border-color:#76583c}.skill-main{display:grid;grid-template-columns:minmax(0,1fr) 25px 29px;gap:3px;align-items:center}.skill-name{min-width:0;font-size:11px;line-height:1.05;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.skill-name small{display:block;margin-top:2px;font-size:9px;color:#765f45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.skill-ability,.skill-mod{min-height:25px;display:grid;place-items:center;border:1px solid #a98d67;background:#dfc8a5;font-size:9px;font-weight:850}.skill-mod{font-size:11px;background:#ead6b5}.skill-prof-label{display:block;margin-top:2px;color:#715a40;font-size:9px;line-height:1.05}.spell-section{margin-top:8px}.spell-section h3{margin:0 0 4px;font-size:13px}.spell-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.spell-card{min-width:0;padding:5px 6px;border:1px solid #ad936d;border-radius:5px;background:#f8ead0;font-size:11px;line-height:1.15;font-weight:750;overflow-wrap:anywhere}.spell-source{display:block;margin-top:2px;color:#715a40;font-size:9px;line-height:1.1}.spell-empty{padding:10px;border:1px dashed #a48a64;font-size:12px;text-align:center;color:#715a40}
.quest-list,.map-list{display:grid;gap:5px}.quest-row{width:100%;min-height:44px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;padding:6px 8px;border:1px solid #9d805c;border-radius:6px;background:#f8ead0;color:#342719;text-align:left}.quest-row:disabled{opacity:.58;background:#d8c6a8;color:#655643}.quest-title{min-width:0;font-size:13px;font-weight:850}.quest-title small{display:block;margin-top:2px;font-size:9px;font-weight:600;color:#765f45}.quest-status{min-width:37px;padding:3px 5px;border:1px solid #9d805c;border-radius:10px;background:#dfc8a5;font-size:10px;font-weight:850;text-align:center}.quest-note{margin:0 0 6px;font-size:11px;color:#715a40}.map-current{margin-bottom:6px;padding:6px 8px;border:1px solid #9d805c;background:#e1c9a2;border-radius:6px;font-size:12px;font-weight:800}.map-list{grid-template-columns:repeat(2,minmax(0,1fr))}.map-card{min-height:38px;padding:5px 6px;border:1px solid #ad936d;border-radius:5px;background:#f8ead0;font-size:11px;line-height:1.15}.map-empty{padding:10px;border:1px dashed #a48a64;font-size:12px;text-align:center;color:#715a40}
@media(max-width:430px){#topBar{grid-template-columns:50px minmax(0,1fr) 104px}#topRight{grid-template-columns:43px 43px}.system-button{width:43px}#metaLine{font-size:11px;gap:5px}#statusLine{font-size:11px;gap:7px}#handLine{font-size:9px;gap:7px}#mainArea{grid-template-columns:80px minmax(0,1fr)}#storyArea{padding:15px 13px 24px}.quick-button{font-size:11px}}
</style>
</head>
<body>
<div id="gameScreen">
<header id="topBar">
  <div id="topLeft"><button id="topButton" class="system-button" type="button"><span class="icon">⌂</span><span class="label">TOP</span></button></div>
  <div id="topCenter">
    <div id="metaLine"><span id="gameDate">Day 1</span><span id="gameTime">08:00</span><span id="currentLocation">未設定</span></div>
    <div id="statusLine"><span>Lv. <strong id="miniLevel">1</strong></span><span>HP <strong id="miniHp">-</strong></span><span>AC <strong id="miniAc">-</strong></span></div>
    <div id="handLine"><span class="hand-entry">利き手 <strong id="mainHandText">なし</strong></span><span class="hand-entry">逆手 <strong id="offHandText">なし</strong></span></div>
  </div>
  <div id="topRight"><button id="loadButton" class="system-button" type="button"><span class="icon">⇩</span><span class="label">LOAD</span></button><button id="saveButton" class="system-button" type="button"><span class="icon">▣</span><span class="label">SAVE</span></button><button id="logButton" class="system-button" type="button"><span class="icon">≡</span><span class="label">LOG</span></button></div>
</header>
<main id="mainArea">
  <aside id="equipmentArea"><h2 id="equipmentTitle">装備</h2><div id="equipmentList"></div></aside>
  <section id="storyArea"><div id="speakerName">Brackenford</div><p id="messageText">石造りの建物が並ぶ町だ。
通りには旅人と商人の姿が見える。</p></section>
</main>
<nav id="quickBar">
  <button id="questButton" class="quick-button" type="button">クエスト</button>
  <button id="itemButton" class="quick-button" type="button">所持品</button>
  <button id="skillButton" class="quick-button" type="button">スキル</button>
  <button id="spellButton" class="quick-button" type="button">呪文</button>
  <button id="mapButton" class="quick-button" type="button">マップ</button>
</nav>
<div id="windowLayer" hidden><section id="gameWindow"><header id="windowHeader"><div id="windowTitle">所持品</div><button id="windowCloseButton" type="button">×</button></header><div id="windowContent"></div></section></div>
</div>
<script src="data/dd-srd-character.js?v=20260830-2"></script>
<script src="data/dd-class-options.js?v=20260830-2"></script>
<script src="data/dd-items.js?v=20260830-2"></script>
<script src="data/dd-quests.js?v=20260830-1"></script>
<script src="js/dd-inventory.js?v=20260830-2"></script>
<script src="js/dd-inventory-ui.js?v=20260830-2"></script>
<script src="js/dd-github.js?v=20260830-2"></script>
<script src="js/dd-save.js?v=20260830-2"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const windowLayer=$('windowLayer'),windowTitle=$('windowTitle'),windowContent=$('windowContent');
function escHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function activeGame(){try{return JSON.parse(localStorage.getItem('ddActiveGame')||'null');}catch(_){return null;}}
function persistGame(game){localStorage.setItem('ddActiveGame',JSON.stringify(game));}
function fmtMod(value){return value>=0?`+${value}`:String(value);}
function abilityMod(score){return Math.floor(((Number(score)||10)-10)/2);}
function proficiencyBonusFromLevel(level){const lv=Math.max(1,Math.min(20,Math.floor(Number(level)||1)));return Math.min(6,2+Math.floor((lv-1)/4));}
function calculateAc(game){
  const c=game?.character||{},dex=abilityMod(c.abilities?.dex),equipment=Array.isArray(game?.equipment)?game.equipment:[],inventory=Array.isArray(game?.inventory)?game.inventory:[];
  let ac=10+dex,armorFound=false,bonus=0;
  for(const entry of equipment){const owned=inventory.find(i=>i.uid===entry.uid)||inventory.find(i=>i.itemId===entry.itemId);const data=window.DDInventory?.itemData(entry.itemId||owned?.itemId);if(!data)continue;if(data.type==='armor'&&data.id!=='shield'&&data.ac!=null){ac=Number(data.ac);armorFound=true;}if(data.acBonus!=null)bonus+=Number(data.acBonus)||0;}
  if(!armorFound)ac=10+dex;return ac+bonus;
}
function equipmentName(game,slot){
  const equipment=Array.isArray(game?.equipment)?game.equipment:[],inventory=Array.isArray(game?.inventory)?game.inventory:[];
  const entry=equipment.find(item=>item.slot===slot);if(!entry)return 'なし';
  const owned=inventory.find(i=>i.uid===entry.uid)||inventory.find(i=>i.itemId===entry.itemId);const id=entry.itemId||owned?.itemId||'';const data=window.DDInventory?.itemData(id);return data?.ja||data?.name||id||'装備';
}
function renderHeader(){
  const game=activeGame(),c=game?.character||{},time=game?.time||{},current=game?.current||{};
  const day=time.day??current.day??1,hour=time.hour??8,minute=time.minute??0;
  $('gameDate').textContent=`Day ${day}`;$('gameTime').textContent=time.hour!=null?`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`:(current.time||'08:00');$('currentLocation').textContent=game?.location?.label||current.location||'未設定';$('miniLevel').textContent=c.level??1;$('miniHp').textContent=c.maxHp!=null?`${c.hp??c.maxHp}/${c.maxHp}`:(c.hp??'-');$('miniAc').textContent=calculateAc(game);$('mainHandText').textContent=equipmentName(game,'mainHand');$('offHandText').textContent=equipmentName(game,'offHand');
}
function renderEquipment(){
  const root=$('equipmentList'),game=activeGame(),inventory=Array.isArray(game?.inventory)?game.inventory:[],equipment=Array.isArray(game?.equipment)?game.equipment:[];
  const slots=[['head','頭'],['neck','首'],['armor','防具'],['hands','手'],['feet','足'],['other','その他魔法道具']];
  root.innerHTML=slots.map(([slot,label])=>{
    const entries=equipment.filter(item=>item.slot===slot);
    if(!entries.length)return `<div class="equipment-slot"><span class="equipment-slot-label">${escHtml(label)}</span><span class="equipment-slot-item empty">なし</span></div>`;
    const names=entries.map(entry=>{const owned=inventory.find(i=>i.uid===entry.uid)||inventory.find(i=>i.itemId===entry.itemId);const id=entry.itemId||owned?.itemId||'';const data=window.DDInventory?.itemData(id);return data?.ja||data?.name||id||'装備';});
    return `<div class="equipment-slot"><span class="equipment-slot-label">${escHtml(label)}</span><span class="equipment-slot-item">${names.map(escHtml).join('<br>')}</span></div>`;
  }).join('');
}
function openWindow(title,html=''){windowTitle.textContent=title;windowContent.innerHTML=html;windowLayer.hidden=false;}
function closeWindow(){windowLayer.hidden=true;renderEquipment();renderHeader();}
function questStatus(game,id){
  if(Array.isArray(game?.completedQuests)&&game.completedQuests.includes(id))return 'completed';
  const state=game?.questStates?.[id];
  if(state==='completed'||state?.status==='completed')return 'completed';
  if((game?.activeQuestId||game?.quest?.id)===id)return 'active';
  return 'available';
}
function renderQuests(){
  const game=activeGame()||{},quests=Array.isArray(window.DDQuests)?window.DDQuests:[];
  if(!quests.length)return '<div class="map-empty">選べるクエストはまだありません。</div>';
  const rows=quests.map(q=>{const status=questStatus(game,q.id),done=status==='completed',label=done?'済':status==='active'?'進行中':'開始';return `<button class="quest-row" data-quest-id="${escHtml(q.id)}" type="button" ${done?'disabled':''}><span class="quest-title">${escHtml(q.titleJa||q.title)}<small>${escHtml(q.title||'')}</small></span><span class="quest-status">${label}</span></button>`;}).join('');
  return `<p class="quest-note">クエストを選択します。完了済みは再選択できません。</p><div class="quest-list">${rows}</div>`;
}
function bindQuestRows(){
  windowContent.querySelectorAll('.quest-row[data-quest-id]:not(:disabled)').forEach(button=>button.addEventListener('click',()=>{
    const id=button.dataset.questId,q=(window.DDQuests||[]).find(v=>v.id===id);if(!q)return;
    const game=window.DDInventory?.getGame?.()||activeGame()||{};if(questStatus(game,id)==='completed')return;
    game.activeQuestId=id;game.quest={...(game.quest||{}),id,title:q.titleJa||q.title,status:'active'};game.questStates={...(game.questStates||{}),[id]:{...(game.questStates?.[id]||{}),status:'active'}};persistGame(game);
    openWindow('クエスト',renderQuests());bindQuestRows();
  }));
}
const skillDefs=[['Acrobatics','軽業','dex'],['Animal Handling','動物使い','wis'],['Arcana','魔法学','int'],['Athletics','運動','str'],['Deception','ペテン','cha'],['History','歴史','int'],['Insight','看破','wis'],['Intimidation','威圧','cha'],['Investigation','捜査','int'],['Medicine','医術','wis'],['Nature','自然','int'],['Perception','知覚','wis'],['Performance','芸能','cha'],['Persuasion','説得','cha'],['Religion','宗教','int'],['Sleight of Hand','手先の早業','dex'],['Stealth','隠密','dex'],['Survival','生存','wis']];
function renderSkills(){
  const game=activeGame(),c=game?.character||{},level=Math.max(1,Math.floor(Number(c.level)||1)),pb=proficiencyBonusFromLevel(level),proficient=new Set((c.skills||[]).map(v=>String(v).toLowerCase())),expertise=new Set((Array.isArray(c.classChoices?.expertise)?c.classChoices.expertise:[]).map(v=>String(v).toLowerCase()));
  const rows=skillDefs.map(([name,ja,ability])=>{const key=name.toLowerCase(),expert=expertise.has(key),prof=expert||proficient.has(key),total=abilityMod(c.abilities?.[ability])+(expert?pb*2:prof?pb:0);return `<div class="skill-row ${prof?'proficient':''}"><div class="skill-main"><div class="skill-name">${escHtml(ja)}<small>${escHtml(name)}</small></div><div class="skill-ability">${ability.toUpperCase()}</div><div class="skill-mod">${fmtMod(total)}</div></div><div class="skill-prof-label">${expert?'Expertise':prof?'● 習熟':'未習熟'}</div></div>`;}).join('');
  return `<div class="skill-summary">Lv.${level}　習熟ボーナス ${fmtMod(pb)}</div><div class="skill-list">${rows}</div>`;
}
function list(value){return Array.isArray(value)?value.filter(Boolean):value?[value]:[];}
function spellSection(title,values,source=''){const spells=[...new Set(list(values))];if(!spells.length)return '';return `<section class="spell-section"><h3>${escHtml(title)}</h3><div class="spell-grid">${spells.map(name=>`<div class="spell-card">${escHtml(name)}${source?`<span class="spell-source">${escHtml(source)}</span>`:''}</div>`).join('')}</div></section>`;}
function renderSpells(){
  const game=activeGame(),c=game?.character||{},choices=c.classChoices||{},sections=[];
  sections.push(spellSection('キャントリップ',choices.cantrips,'クラス'));
  sections.push(spellSection('レベル1呪文',choices.preparedSpells,'クラス'));
  sections.push(spellSection('スペルブック',choices.spellbook,'Wizard'));
  const origin=c.originSpells||{};
  for(const [key,data] of Object.entries(origin)){if(!data||typeof data!=='object')continue;const source=key==='background'?'背景':key==='human'?'Human':key;const detail=[source,data.spellList,data.spellcastingAbility].filter(Boolean).join(' / ');sections.push(spellSection(`${source}：キャントリップ`,data.cantrips,detail));sections.push(spellSection(`${source}：レベル1呪文`,data.level1,detail));}
  if(Array.isArray(c.spells))sections.push(spellSection('その他の呪文',c.spells,'キャラクター'));
  const html=sections.filter(Boolean).join('');return `<p class="spell-intro">${escHtml(c.classNameJa||c.className||'キャラクター')}の現在の呪文です。</p>${html||'<div class="spell-empty">現在使用できる呪文はありません。</div>'}`;
}
function renderMap(){
  const game=activeGame()||{},current=game?.location?.label||game?.current?.location||'未設定';
  const source=Array.isArray(game.discoveredMaps)?game.discoveredMaps:Array.isArray(game.maps)?game.maps:[];
  const maps=source.map(v=>typeof v==='string'?{name:v}:v).filter(Boolean);
  const rows=maps.length?`<div class="map-list">${maps.map(v=>`<div class="map-card">${escHtml(v.label||v.name||v.title||v.id||'マップ')}</div>`).join('')}</div>`:'<div class="map-empty">発見済みのマップはまだありません。</div>';
  return `<div class="map-current">現在地：${escHtml(current)}</div>${rows}`;
}
function renderLog(){const log=activeGame()?.log||[];return Array.isArray(log)&&log.length?log.map(v=>`<p>${escHtml(typeof v==='string'?v:JSON.stringify(v))}</p>`).join(''):'<p>ログはまだありません。</p>';}
$('questButton').addEventListener('click',()=>{openWindow('クエスト',renderQuests());bindQuestRows();});
$('itemButton').addEventListener('click',()=>{openWindow('所持品');if(window.DDInventoryUI)DDInventoryUI.render(windowContent);else windowContent.innerHTML='<p>所持品を読み込めませんでした。</p>';});
$('skillButton').addEventListener('click',()=>openWindow('スキル',renderSkills()));
$('spellButton').addEventListener('click',()=>openWindow('呪文',renderSpells()));
$('mapButton').addEventListener('click',()=>openWindow('マップ',renderMap()));
$('logButton').addEventListener('click',()=>openWindow('LOG',renderLog()));
$('windowCloseButton').addEventListener('click',closeWindow);
$('topButton').addEventListener('click',()=>location.href='DD_top.html');
$('loadButton').addEventListener('click',()=>location.href='DD_saves.html');
$('saveButton').addEventListener('click',async()=>{const button=$('saveButton');if(button.disabled)return;button.disabled=true;try{const raw=localStorage.getItem('ddActiveGame');if(!raw)throw new Error('セーブするゲームデータがありません。');const saved=await DDSave.openSaveDialog(JSON.parse(raw));localStorage.setItem('ddActiveGame',JSON.stringify(saved));renderEquipment();renderHeader();}catch(error){if(error?.message!=='セーブをキャンセルしました。')alert(error?.message||'セーブに失敗しました。');}finally{button.disabled=false;}});
if(window.DDInventory)DDInventory.getGame();renderEquipment();renderHeader();
</script>
</body>
</html>
